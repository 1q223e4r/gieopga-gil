<style>
/* 기본 리셋: 노치·홈 바 영역(safe area)만큼 위아래 여백 */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 남색 '게임 테이블' 위에 실제 보드판 → 그 아래 플레이어 카드 → 맨 아래 큰 주사위 버튼 (한 화면 앱) */
:root{
  --table:#0B1F38; --table-2:#14305A; --on-table:#EAF0F7; --on-table-dim:#9FB2C8;
  --navy:#14365D; --paper:#FFFFFF; --ink:#1B2836; --muted:#5E6B7A; --hair:#DCE3EB; --soft:#F1F4F8;
  --gold:#FFC21A; --gold-deep:#C99400;
  --food:#FF7A00; --food-bg:#FFEEDE; --mfg:#1F6BFF; --mfg-bg:#E2ECFF;
  --tech:#8B3DFF; --tech-bg:#F0E6FF; --fin:#FFB300; --fin-bg:#FFF5DE;
  --red:#EE3B2F; --green:#0FA25E; --teal:#0E8A80; --strat:#2D5E5A; --dash:#9FB0C2;
  --pos:#1F7A4D; --neg:#C2372D; --tag:#B8862B;
  --font:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif;
  --deck-font:Arial,'Liberation Sans',Helvetica,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--table);color:var(--on-table);font-family:var(--font);-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ── 상단 ── */
.top{display:flex;align-items:center;gap:10px;padding-block:10px 8px;min-height:56px}
.brand{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.brand b{font-size:18px;font-weight:900;letter-spacing:-.03em;color:#fff;line-height:1}
.bar4{display:flex;height:3px;width:100%;border-radius:2px;overflow:hidden}
.bar4 i{flex:1}.bar4 i:nth-child(1){background:var(--food)}.bar4 i:nth-child(2){background:var(--mfg)}.bar4 i:nth-child(3){background:var(--tech)}.bar4 i:nth-child(4){background:var(--fin)}
.chips{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
.chip{font-size:11.5px;font-weight:700;line-height:1;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--on-table);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.boom{background:#1D6B48;color:#E6FFF2}.chip.slump{background:#4B5D77;color:#EEF3FA}.chip.infl{background:#9A4A12;color:#FFF1E6}.chip.final{background:var(--gold);color:var(--navy)}
.icon-btn{flex:0 0 auto;width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:22px;height:22px}

/* ── 본문(보드 + 플레이어) ── */
.stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;padding-block:2px 10px;scrollbar-width:none}
.stage::-webkit-scrollbar{display:none}
.board-wrap{position:relative;container-type:inline-size;width:100%;flex:0 0 auto;margin:0 auto;
  width:min(100%,max(280px,calc(100vh - var(--reserve,300px) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))));
  width:min(100%,max(280px,calc(100dvh - var(--reserve,300px) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))))}
.board{display:grid;grid-template-columns:1.55fr repeat(7,1fr) 1.55fr;grid-template-rows:1.55fr repeat(7,1fr) 1.55fr;
  gap:1px;padding:1%;background:var(--navy);aspect-ratio:1/1;border-radius:6px;box-shadow:0 14px 34px rgba(0,0,0,.42);max-width:100%}
.cell{position:relative;min-width:0;min-height:0;border:0;margin:0;padding:0;background:var(--paper);color:var(--navy);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;cursor:pointer;line-height:1.12;
  -webkit-appearance:none;appearance:none}
.cell:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;z-index:2}
.cell.prop{background:var(--gb);justify-content:flex-start}
.cell .band{display:block;width:100%;flex:0 0 auto;height:10%;background:var(--gc)}
.cell.h .band{height:14%}
.cell .nm{font-weight:700;font-size:8px;font-size:clamp(6.5px,2.3cqw,13px);margin-top:1.1cqw;letter-spacing:-.03em;color:var(--navy)}
.cell.h .nm{margin-top:1cqw;white-space:nowrap}
.cell .pr{font-size:7px;font-size:clamp(6px,1.95cqw,11px);color:var(--muted);margin-top:.5cqw;font-variant-numeric:tabular-nums;font-weight:500}
.cell.owned{box-shadow:inset 0 0 0 .65cqw var(--oc)}
.cell .own{position:absolute;right:.65cqw;bottom:.65cqw;width:3.4cqw;height:3.4cqw;border-radius:50%;background:var(--oc);color:#fff;
  font-size:2.1cqw;font-weight:900;display:grid;place-items:center;line-height:1}
.cell .bon{position:absolute;left:.75cqw;bottom:.65cqw;font-size:1.75cqw;font-weight:900;color:var(--pos);line-height:1}
.cell.strike::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 .9cqw,rgba(194,55,45,.28) .9cqw 1.5cqw);pointer-events:none}
.cell .bdg{width:5.4cqw;height:5.4cqw;border-radius:50%;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.cell .bdg svg{width:58%;height:58%}
.cell .bdg.n{background:var(--navy)}.cell .bdg.s{background:var(--teal)}
.cell .lb{font-size:7px;font-size:clamp(6px,1.9cqw,11px);font-weight:700;margin-top:.8cqw;white-space:nowrap;letter-spacing:-.03em}
.cell.news .lb{color:var(--navy)}.cell.strat .lb{color:var(--teal)}
.cell.ev{color:#fff}.cell.ev .lb{color:#fff;margin-top:.5cqw}
.cell.red{background:var(--red)}.cell.green{background:var(--green)}.cell.start{background:var(--navy)}
.cell.ev .ic{width:4.2cqw;height:4.2cqw}.cell .ic svg{width:100%;height:100%;display:block}
.cell .am{font-size:6.5px;font-size:clamp(5.5px,1.8cqw,10px);font-weight:700;margin-top:.3cqw;font-variant-numeric:tabular-nums}
.cell.corner{color:#fff}
.cell.corner .ic{width:6.4cqw;height:6.4cqw}
.cell.start .ic{color:var(--gold)}
.cell.corner .cn{font-size:11px;font-size:clamp(9px,3.3cqw,19px);font-weight:900;margin-top:.7cqw;letter-spacing:-.03em}
.cell.corner .cs{font-size:7px;font-size:clamp(6px,1.95cqw,11px);font-weight:700;margin-top:.4cqw;white-space:nowrap;font-variant-numeric:tabular-nums}
.cell.flash{animation:flash .9s ease-out}
@keyframes flash{0%{filter:brightness(1.35)}100%{filter:none}}

.center{grid-column:2/9;grid-row:2/9;background:var(--paper);color:var(--navy);display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;padding:3.2cqw 3cqw 2.6cqw;min-width:0;min-height:0;overflow:hidden}
.c-head{display:flex;flex-direction:column;align-items:center;gap:1.2cqw}
.c-title{font-size:22px;font-size:6.6cqw;font-weight:900;letter-spacing:-.04em;line-height:1}
.c-head .bar4{width:34cqw;height:.8cqw}
.c-rule{font-size:2.2cqw;color:var(--muted);font-weight:500}
.c-mid{display:flex;align-items:center;gap:4.2cqw}
.mini-deck{position:relative;width:9.6cqw;height:13.4cqw;border-radius:1.3cqw;display:grid;place-items:center;color:#fff;
  box-shadow:0 0 0 .3cqw #fff,0 0 0 .5cqw var(--dash),.8cqw .8cqw 0 -.05cqw var(--deck),.8cqw .8cqw 0 .25cqw #fff,.8cqw .8cqw 0 .45cqw var(--dash),1.6cqw 1.6cqw 0 -.05cqw var(--deck),1.6cqw 1.6cqw 0 .25cqw #fff,1.6cqw 1.6cqw 0 .45cqw var(--dash)}
.mini-deck.n{--deck:var(--navy);background:var(--navy)}.mini-deck.s{--deck:var(--strat);background:var(--strat)}
.mini-deck b{width:6.6cqw;height:6.6cqw;border-radius:50%;box-shadow:0 0 0 .3cqw rgba(255,255,255,.7);display:grid;place-items:center;
  font-family:var(--deck-font);font-weight:700;font-size:3.9cqw;line-height:1}
.mini-deck em{position:absolute;bottom:-4.6cqw;left:0;right:0;font-style:normal;font-size:1.9cqw;color:var(--muted);font-weight:700;white-space:nowrap;text-align:center}
.dice{display:flex;gap:2.2cqw;background:none;border:0;padding:1.2cqw;border-radius:2.4cqw;cursor:default}
.dice.ready{cursor:pointer;background:rgba(255,194,26,.18);box-shadow:0 0 0 .4cqw rgba(255,194,26,.6)}
.die{width:10.6cqw;height:10.6cqw;border-radius:2.2cqw;background:#fff;box-shadow:inset 0 0 0 .38cqw var(--navy),0 .6cqw 0 var(--navy);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:1.7cqw;gap:.25cqw}
.die i{border-radius:50%;background:var(--navy);opacity:0;transform:scale(.75);transition:opacity .08s}
.die[data-v="1"] i:nth-child(5),.die[data-v="2"] i:nth-child(1),.die[data-v="2"] i:nth-child(9),
.die[data-v="3"] i:nth-child(1),.die[data-v="3"] i:nth-child(5),.die[data-v="3"] i:nth-child(9),
.die[data-v="4"] i:nth-child(1),.die[data-v="4"] i:nth-child(3),.die[data-v="4"] i:nth-child(7),.die[data-v="4"] i:nth-child(9),
.die[data-v="5"] i:nth-child(1),.die[data-v="5"] i:nth-child(3),.die[data-v="5"] i:nth-child(5),.die[data-v="5"] i:nth-child(7),.die[data-v="5"] i:nth-child(9),
.die[data-v="6"] i:nth-child(1),.die[data-v="6"] i:nth-child(3),.die[data-v="6"] i:nth-child(4),.die[data-v="6"] i:nth-child(6),.die[data-v="6"] i:nth-child(7),.die[data-v="6"] i:nth-child(9){opacity:1}
.die[data-v="1"] i:nth-child(5){background:var(--red);transform:scale(1)}
.dice.rolling .die{animation:tumble .16s linear infinite}
@keyframes tumble{0%{transform:rotate(-12deg) translateY(-1cqw)}50%{transform:rotate(10deg) translateY(.4cqw)}100%{transform:rotate(-12deg) translateY(-1cqw)}}
.c-turn{display:flex;align-items:center;gap:1.4cqw;font-size:3.1cqw;font-weight:900;letter-spacing:-.02em;min-height:4cqw}
.tdot{width:3.2cqw;height:3.2cqw;border-radius:50%;background:var(--pc);box-shadow:0 0 0 .4cqw #fff,0 0 0 .7cqw var(--pc)}
.c-msg{font-size:9px;font-size:clamp(8px,2.55cqw,14px);color:var(--ink);text-align:center;line-height:1.38;min-height:2.8em;max-width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500}

.pawns{position:absolute;inset:0;pointer-events:none}
.pawn{position:absolute;left:0;top:0;width:4.3cqw;height:4.3cqw;margin:-2.15cqw 0 0 -2.15cqw;z-index:3;will-change:transform;
  transition:transform .17s cubic-bezier(.3,.7,.4,1)}
.pawn span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--pc);color:#fff;font-weight:900;
  font-size:2.35cqw;line-height:1;box-shadow:0 0 0 .5cqw #fff,0 .6cqw 1.2cqw rgba(0,0,0,.4)}
.pawn.cur{z-index:4}
.pawn.cur span{box-shadow:0 0 0 .5cqw #fff,0 0 0 1.15cqw rgba(255,194,26,.85),0 .6cqw 1.2cqw rgba(0,0,0,.4)}
.pawn.hop span{animation:hop .17s ease-out}
.pawn.gone{opacity:0}
@keyframes hop{50%{transform:translateY(-1.8cqw) scale(1.1)}}

.players{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:8px;flex:0 0 auto}
.players.c3 .pl{padding:8px 8px 8px 7px;column-gap:6px;grid-template-columns:22px minmax(0,1fr)}
.players.c3 .pl .kind{display:none}.players.c3 .pl .dot{width:22px;height:22px}.players.c3 .pl .cash{grid-column:2/3;font-size:15px}
.players.c3 .pl .meta{gap:0 6px}
.pl{position:relative;background:var(--paper);color:var(--ink);border-radius:12px;padding:9px 10px 9px 9px;border:0;text-align:left;cursor:pointer;
  display:grid;grid-template-columns:24px minmax(0,1fr) auto;column-gap:8px;row-gap:1px;align-items:center;min-width:0}
.pl.active{box-shadow:0 0 0 3px var(--gold)}
.pl.out{opacity:.55}
.pl .dot{grid-row:1/3;width:24px;height:24px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900}
.pl .pn{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pl .kind{font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap}
.pl .cash{grid-column:2/4;font-size:16px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pl .meta{grid-column:1/4;font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:2px 8px;font-variant-numeric:tabular-nums}
.pl .meta svg{width:12px;height:12px;vertical-align:-2px;color:var(--teal)}
.float{position:absolute;right:10px;top:8px;font-size:13px;font-weight:900;padding:2px 7px;border-radius:999px;pointer-events:none;
  animation:float 1.4s ease-out forwards;font-variant-numeric:tabular-nums}
.float.p{background:#DDF5E8;color:var(--pos)}.float.m{background:#FDE3E1;color:var(--neg)}
@keyframes float{0%{transform:translateY(6px);opacity:0}15%{transform:none;opacity:1}75%{opacity:1}100%{transform:translateY(-12px);opacity:0}}

/* ── 최근 기록 (남는 세로 공간을 채우고, 모자라면 잘림) ── */
.feed{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:5px;padding:2px 4px 0}
.feed h2{margin:0 0 2px;font-size:11.5px;font-weight:700;color:var(--on-table-dim);letter-spacing:.06em}
.feed p{margin:0;font-size:13px;line-height:1.45;color:var(--on-table-dim)}
.feed p:nth-of-type(1){color:var(--on-table)}
/* ── 하단 버튼 ── */
.actionbar{flex:0 0 auto;padding-block:8px 12px}
.btn{min-height:48px;border-radius:12px;border:0;font-weight:700;font-size:16px;cursor:pointer;padding:0 16px;letter-spacing:-.01em}
.btn.primary{background:var(--gold);color:var(--navy);box-shadow:0 4px 0 var(--gold-deep)}
.btn.primary:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--gold-deep)}
.btn.primary:disabled{background:#2C4567;color:#A8B8CC;box-shadow:none;cursor:default}
.btn.big{width:100%;min-height:56px;font-size:17px}
.btn.ghost{background:var(--soft);color:var(--navy)}
.btn.navy{background:var(--navy);color:#fff}
.btn.danger{background:#FCE4E2;color:var(--neg)}

/* ── 시트 / 카드 레이어 ── */
.scrim{position:fixed;inset:0;background:rgba(4,14,28,.62);opacity:0;transition:opacity .2s;z-index:20}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--paper);color:var(--ink);border-radius:18px 18px 0 0;
  max-height:88%;overflow-y:auto;overscroll-behavior:contain;
  padding:4px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.grip{width:40px;height:4px;border-radius:2px;background:#C9D3DE;margin:8px auto 12px}
.sh-title{font-size:20px;font-weight:900;color:var(--navy);margin:0 0 4px;letter-spacing:-.03em;text-wrap:balance}
.sh-sub{font-size:13.5px;color:var(--muted);margin:0 0 14px;line-height:1.5}
.sh-note{font-size:14px;color:var(--ink);margin:12px 0 0;line-height:1.5}
.sh-actions{display:flex;gap:10px;margin-top:16px}
.sh-actions .btn{flex:1}
.sec{margin-top:18px}
.sec h3{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px;letter-spacing:.02em}
.prow{display:grid;grid-template-columns:26px minmax(0,1fr) auto 40px;gap:8px;align-items:center;margin-bottom:8px}
.prow .dot{width:26px;height:26px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px}
.prow input{width:100%;min-width:0;height:44px;border-radius:10px;border:1px solid var(--hair);background:#fff;color:var(--ink);padding:0 11px;font:inherit;font-size:15px}
.x-btn{width:40px;height:40px;border-radius:10px;border:0;background:var(--soft);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.x-btn svg{width:18px;height:18px}.x-btn:disabled{opacity:.35;cursor:default}
.seg{display:inline-flex;background:var(--soft);border-radius:11px;padding:3px;gap:2px;max-width:100%;flex-wrap:wrap}
.seg button{min-height:38px;border:0;background:transparent;border-radius:9px;padding:0 11px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(20,54,93,.18)}
.seg.full{display:flex}.seg.full button{flex:1}
.add-btn{width:100%;min-height:44px;border-radius:10px;border:1.5px dashed #B9C6D4;background:#fff;color:var(--navy);font-weight:700;font-size:14px;cursor:pointer}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:var(--soft);border:0;width:100%;cursor:pointer;text-align:left}
.switch span{font-size:14px;font-weight:700;color:var(--navy)}.switch small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}

function earn(p, amt) {

// 지불: 현금이 모자라면 싼 기업부터 은행에 반값에 팔고, 그래도 모자라면 파산
async function pay(p, amt, to, why) {
  amt = Math.max(0, Math.round(amt));
  if (amt === 0 || p.out) return true;
  if (p.cash < amt) {
    const mine = ownedBy(p).sort((a, b) => CELLS[a].price - CELLS[b].price);
    for (const id of mine) {
      if (p.cash >= amt) break;
      const got = Math.round(CELLS[id].price * SELL_RATE);
      p.cash += got; S.bank.paid += got;
      S.props[id] = { owner: -1, bonus: 0, tech: 0, strike: false };
      const m = `${j(p.name, '이/가')} 돈이 모자라 ${j(CELLS[id].name, '을/를')} 은행에 ${fmt(got)}에 팔았어요`;
      log(m); io.notify(m); io.refresh();
      await sleep(T('pay'));
    }
  }
  if (p.cash >= amt) {
    p.cash -= amt;
    if (to) to.cash += amt; else S.bank.recv += amt;
    io.money(p, -amt); if (to) io.money(to, amt);
    return true;
  }
  // 파산: 남은 현금은 받을 사람(없으면 은행)에게
  const left = p.cash; p.cash = 0;
  if (to) { to.cash += left; if (left) io.money(to, left); } else S.bank.recv += left;
  p.out = true; p.outAt = S.turns;
  const m = `${j(p.name, '이/가')} ${j(why, '을/를')} 낼 돈이 없어 파산했어요`;
  log(m); io.notify(m, 'bad'); io.refresh();
  if (active().length <= 1) S.phase = 'over';
  return false;
}

async function gameLoop() {
  const s = S;
  while (s === S && s.phase === 'play') {
    const p = s.players[s.turn];
    if (!p.out) await takeTurn(p);
    if (s !== S) return;
    if (G.headless) audit();
    if (s.phase !== 'play') break;
    nextTurn();
  }
  if (s === S && s.phase === 'over') {
    save(); io.refresh();
    if (!G.headless) { Snd.win(); await sleep(500); }
    await io.results();
  }

  save();

    ctx.options = all.filter(id => Math.round(CELLS[id].price * 1.5) <= p.cash);
    if (!all.length) ctx.note = '다른 사람 기업이 아직 없어서 효과가 없어요.';
    else if (!ctx.options.length) ctx.note = '1.5배 가격을 낼 현금이 모자라서 살 수 있는 기업이 없어요.';
  } else if (card.pick === 'free') {
    const all = PROP_IDS.filter(id => S.props[id].owner === -1);
    ctx.options = all.filter(id => CELLS[id].price <= p.cash);
    if (!all.length) ctx.note = '주인 없는 기업이 없어서 효과가 없어요.';
    else if (!ctx.options.length) ctx.note = '현금이 모자라서 살 수 있는 빈 기업이 없어요.';

async function cardTurn(p, deck) {

  if (!id) id = draw(deck);

  const card = CARD[id];
  Snd.card();

  let choice = ctx.forced;
  if (card.pick && ctx.options.length) {
    if (p.ai) choice = AI.pick(p, card, ctx.options);
    else choice = await io.showCard(p, card, ctx);
  }
  if (p.ai || !(card.pick && ctx.options.length)) await io.showCard(p, card, ctx, choice, true);
  log(`${p.name}: [${card.id}] ${card.title}`);
  await applyCard(p, card, choice);

}

    case 'inflation': S.infl = { left: LAP_ROUNDS }; say(`물가 상승: ${LAP_ROUNDS}라운드 동안 기업 구입 가격 +20%`, 'bad'); break;

    case 'stockBoom': for (const q of act) { const n = countGroup(q, 'fin'); if (n) earn(q, 20 * n); } say('증시 호황: 금융·에너지 기업마다 +20만', 'good'); break;

    case 'stimulus': for (const q of act) earn(q, 50); say('경기 부양책: 모두 50만을 받았어요', 'good'); break;

    case 'strike': if (choice != null) { S.props[choice].strike = true; say(`${CELLS[choice].name} 파업: ${p.name}의 다음 차례까지 통행료 0`, 'bad'); } break;

    case 'embezzle': if (await pay(p, 50, null, '횡령 손실')) say(`${j(p.name, '이/가')} 횡령 사고로 50만을 잃었어요`, 'bad'); break;

    case 'expand':

          say(`${j(p.name, '이/가')} 사업 확장으로 ${j(c.name, '을/를')} ${fmt(c.price)}에 샀어요`, 'good');

}
function nextTurn() {
  const n = S.players.length;
  let t = S.turn;
  for (let k = 0; k < n; k++) {
    t = (t + 1) % n;
    if (t === 0) { endRound(); if (S.phase !== 'play') return; }
    if (!S.players[t].out) break;
  }
  S.turn = t;
}
function endRound() {
  if (S.econ && --S.econ.left <= 0) { S.econ = null; const m = '경기가 보통으로 돌아왔어요'; log(m); io.notify(m); }
  if (S.infl && --S.infl.left <= 0) { S.infl = null; const m = '물가가 안정됐어요'; log(m); io.notify(m); }
  if (leaderLaps() >= S.settings.laps) { S.phase = 'over'; return; }
  S.round++;
  if (S.round > 600) { S.phase = 'over'; G.audit.push('round limit'); }   // 무한 진행 방지
}

const AI = {
  buy(p, c, price) {
    const lapsLeft = S.settings.laps - leaderLaps();
    let reserve = 150;                         // 세금·통행료 대비 여유 현금
    if (S.infl) reserve += lapsLeft >= 2 ? 200 : 9999;   // 비싸게 사는 건 초반에만
    return p.cash - price >= reserve;
  },
  pick(p, card, options) {
    if (card.pick === 'own') return maxBy(options, id => CELLS[id].price);
    if (card.pick === 'free') { const ok = options.filter(id => p.cash - CELLS[id].price >= 150); return ok.length ? maxBy(ok, id => CELLS[id].price) : null; }
    if (card.pick === 'rival') {   // 1.5배는 자산이 줄어드는 거래 → 돈이 넉넉하고 게임이 많이 남았을 때만
      const lapsLeft = S.settings.laps - leaderLaps();
      if (lapsLeft < 3) return null;
      const ok = options.filter(id => p.cash - Math.round(CELLS[id].price * 1.5) >= 500);
      return ok.length ? maxBy(ok, id => CELLS[id].toll) : null;
    }
    return null;
  },
};

function ranking() {
  return S.players.map(p => ({ p, cash: p.cash, comp: compValue(p), tech: techValue(p), total: assetsOf(p) }))
    .sort((a, b) => (a.p.out - b.p.out) || (b.total - a.total) || (b.cash - a.cash) || (b.p.outAt - a.p.outAt));
}

/* ════════════════════════ 점검(자동 테스트용) ════════════════════════ */
function audit() {
  const start = S.players.length * S.settings.startCash;
  const sum = S.players.reduce((a, p) => a + p.cash, 0);
  if (sum !== start + S.bank.paid - S.bank.recv) G.audit.push(`money mismatch t${S.turns}: ${sum} vs ${start + S.bank.paid - S.bank.recv}`);
  for (const p of S.players) {
    if (p.cash < 0) G.audit.push(`negative cash ${p.name} ${p.cash}`);
    if (p.out && ownedBy(p).length) G.audit.push(`bankrupt owns ${p.name}`);
    if (p.pos < 0 || p.pos > 31) G.audit.push('bad pos');
  }
  for (const id of PROP_IDS) { const o = S.props[id].owner; if (o < -1 || o >= S.players.length) G.audit.push('bad owner'); }
}

const Snd = {

  init() {
    if (!this.on) return;

      const t = this.ctx.currentTime + w, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);

  },
  step() { this.tone(620, 0.045, 'triangle', 0.025); },
  dice() { for (let i = 0; i < 6; i++) this.tone(170 + Math.random() * 260, 0.035, 'square', 0.018, i * 0.07); },
  coin() { this.tone(988, 0.08, 'triangle', 0.05); this.tone(1319, 0.16, 'triangle', 0.05, 0.07); },
  pay() { this.tone(392, 0.1, 'sawtooth', 0.022); this.tone(294, 0.16, 'sawtooth', 0.022, 0.09); },
  card() { this.tone(523, 0.07, 'sine', 0.04); this.tone(784, 0.13, 'sine', 0.04, 0.06); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.2, 'triangle', 0.05, i * 0.12)); },
};

function openSheet(html, { dismiss = true, label = '안내' } = {}) {

  sh.hidden = false; sc.hidden = false; sh.scrollTop = 0;
  void sh.offsetWidth;                 // 리플로 후 클래스 추가 → 슬라이드 애니메이션 유지
  sh.classList.add('open'); sc.classList.add('open');

function showCardUI(p, card, ctx, choice, info) {

    <h2 class="sh-title">메뉴</h2>
    <div class="menu-list" style="margin-top:10px">
      <button class="btn ghost" type="button" data-m="rules" data-focus>${svg('book')} 규칙과 카드 보기</button>
      ${S && !S.preview ? `<button class="btn ghost" type="button" data-m="log">${svg('list')} 최근 기록</button>` : ''}
      <button class="btn ghost" type="button" data-m="sound">${svg(prefs.sound !== false ? 'sound' : 'mute')} 소리 ${prefs.sound !== false ? '끄기' : '켜기'}</button>
      <button class="btn ghost" type="button" data-m="fast">${svg('bolt')} 컴퓨터 속도: ${G.fast ? '빠르게' : '보통'}</button>
      <button class="btn ${playing ? 'danger' : 'navy'}" type="button" data-m="new">${svg('restart')} ${playing ? '이 게임 그만두고 새 게임' : '새 게임'}</button>
    </div>`, { label: '메뉴' });
  $('#sheet').onclick = e => {
    const b = e.target.closest('[data-m]'); if (!b) return;
    const m = b.dataset.m;
    if (m === 'rules') openRules();
    else if (m === 'log') openLog();
    else if (m === 'sound') { prefs.sound = prefs.sound === false; savePrefs(); if (prefs.sound) Snd.init(); openMenu(); }
    else if (m === 'fast') { G.fast = !G.fast; prefs.fast = G.fast; savePrefs(); openMenu(); }
    else if (m === 'new') {
      if (playing) {
        openSheet(`<h2 class="sh-title">지금 게임을 그만둘까요?</h2><p class="sh-sub">진행 중인 게임은 사라지고 새 게임 설정으로 넘어가요.</p>
          <div class="sh-actions"><button class="btn ghost" type="button" data-c="no" data-focus>계속하기</button><button class="btn danger" type="button" data-c="yes">그만두기</button></div>`, { label: '확인' });
        $('#sheet').onclick = ev => { const c = ev.target.closest('[data-c]'); if (!c) return; if (c.dataset.c === 'yes') { stopGame(); openSetup(null); } else closeSheet(); };
      } else openSetup(null);
    }
  };
}
function openRules() {
  const decks = d => CARDS.filter(c => c.deck === d).map(c => cardFace(c, true)).join('');
  openSheet(`
    <h2 class="sh-title">규칙</h2>
    <div class="rules">
      <h4>목표</h4><p>정해진 바퀴(1년 = 4바퀴)가 끝났을 때 <b>현금 + 기업 가치</b>가 가장 큰 사람이 이겨요. 누군가 목표 바퀴를 채우면 그 라운드까지만 하고 끝나서, 모두 같은 횟수만큼 차례를 가져요.</p>
      <h4>차례</h4><ul><li>주사위 2개를 굴려 나온 수만큼 이동해요.</li><li>출발을 지나거나 도착하면 매출 ${START_PAY}만을 받아요.</li></ul>
      <h4>기업 칸</h4><ul><li>주인이 없으면 땅값을 내고 살 수 있어요.</li><li>남의 기업에 도착하면 통행료(땅값의 15%)를 내요.</li><li>테두리 색과 번호가 주인을 뜻해요.</li></ul>
      <h4>특수 칸</h4><ul><li>경제위기 −300만 · 금융위기 −150만 · 세금 −150만 · 법인세 −80만</li><li>정부지원 +150만 · 창업지원 +80만</li></ul>
      <h4>카드</h4><ul><li>경제 뉴스(N)는 모두에게, 경영 전략(S)은 뽑은 사람에게 적용돼요.</li><li>'한 바퀴' 효과는 ${LAP_ROUNDS}라운드 동안 이어져요.</li></ul>
      <h4>돈이 모자라면</h4><p>가진 기업을 싼 것부터 은행에 땅값의 절반에 팔아요. 그래도 모자라면 파산해서 게임에서 빠져요.</p>
      <h4>경제 뉴스 카드</h4><div class="card-grid">${decks('N')}</div>
      <h4>경영 전략 카드</h4><div class="card-grid">${decks('S')}</div>
    </div>
    <div class="sh-actions"><button class="btn ghost" type="button" data-close data-focus>닫기</button></div>`, { label: '규칙' });
  $('#sheet').onclick = e => { if (e.target.closest('[data-close]')) closeSheet(); };
}
function openLog() {
  const items = S.log.slice().reverse().map(t => `<li>${esc(t)}</li>`).join('');
  openSheet(`<h2 class="sh-title">최근 기록</h2>${items ? `<ul class="log">${items}</ul>` : '<div class="empty">아직 기록이 없어요.</div>'}
    <div class="sh-actions"><button class="btn ghost" type="button" data-close data-focus>닫기</button></div>`, { label: '기록' });
  $('#sheet').onclick = e => { if (e.target.closest('[data-close]')) closeSheet(); };
}
function openResults() {
  const r = ranking(), w = r[0].p;
  const byLaps = active().length > 1;
  openSheet(`
    <h2 class="sh-title">${esc(j(w.name, '이/가'))} 이겼어요</h2>
    <p class="sh-sub">${byLaps ? `${S.settings.laps / 4}년(${S.settings.laps}바퀴)이 끝났어요 · ${S.round}라운드` : '나머지 플레이어가 모두 파산했어요'}. 최종 자산 = 현금 + 기업 가치</p>
    <div class="rank">${r.map((x, i) => `<div class="rk${i === 0 ? ' win' : ''}" style="--pc:${x.p.color}">
      <span class="no">${i + 1}</span><span class="dot">${x.p.id + 1}</span>
      <span class="who2"><b>${esc(x.p.name)}</b><small>${x.p.out ? '파산' : `현금 ${fmt(x.cash)} + 기업 ${fmt(x.comp)}${x.tech ? ` + 기술 ${fmt(x.tech)}` : ''}`}</small></span>
      <span class="tot">${fmt(x.total)}</span></div>`).join('')}</div>
    <div class="sh-actions"><button class="btn ghost" type="button" data-r="setup">설정 바꾸기</button><button class="btn primary" type="button" data-r="again" data-focus>한 판 더</button></div>`,
    { label: '결과' });
  $('#sheet').onclick = e => {
    const b = e.target.closest('[data-r]'); if (!b) return;
    if (b.dataset.r === 'again') { closeSheet(); newGame({ ...prefs }); }
    else openSetup(null);
  };
}

/* ════════════════════════ 시작/재개 ════════════════════════ */
function previewState() {
  const s = newState({ ...prefs }, 7);
  s.preview = true; return s;
}
function stopGame() { G.gen++; abortAll(); G.rollResolve = null; $('#cardLayer').hidden = true; }
function newGame(setup) {
  const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
  startFrom(newState({ players: setup.players, startCash: setup.startCash, laps: setup.laps, extra: setup.extra }, seed));
}
function startFrom(state) {
  stopGame();
  S = state; delete S.preview;
  const d = S.dice || [5, 2]; $('#d1').dataset.v = d[0]; $('#d2').dataset.v = d[1];
  renderAll();
  if (S.phase === 'over') { setAction('result', '결과 보기'); setMsg('게임이 끝났어요'); openResults(); return; }
  setMsg(S.log.length ? S.log[S.log.length - 1] : '게임을 시작해요!');
  run();
}
async function run() {
  const gen = G.gen;
  try { await gameLoop(); }
  catch (e) {
    if (e === ABORT || gen !== G.gen) return;
    console.error(e);
    setMsg('문제가 생겼어요. 메뉴에서 새 게임을 시작해 주세요.');
  }
}

/* ════════════════════════ 이벤트 ════════════════════════ */
function wire() {
  $('#btnMenu').innerHTML = svg('menu');
  $('#btnMenu').addEventListener('click', openMenu);
  $('#btnAct').addEventListener('click', () => {
    const m = $('#btnAct').dataset.mode;
    if (m === 'roll') doRoll();
    else if (m === 'setup') openSetup(loadPlayable());
    else if (m === 'result') openResults();
  });
  $('#players').addEventListener('click', e => { const b = e.target.closest('.pl'); if (b) openPlayerInfo(+b.dataset.pid); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('#sheet').hidden && $('#scrim').onclick) closeSheet();
  });
  // 화면 크기가 바뀌면 말 위치 다시 계산
  const ro = window.ResizeObserver ? new ResizeObserver(() => S && renderPawns()) : null;
  if (ro) ro.observe($('#boardWrap')); else window.addEventListener('resize', () => S && renderPawns());
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => S && renderPawns()).catch(() => {});
}
function loadPlayable() { const s = loadSave(); return s && s.phase === 'play' ? s : null; }

function boot(data) {
  G.fast = !!prefs.fast;
  buildBoard(); wire();
  let hot = null;
  try { hot = data && data.save ? JSON.parse(data.save) : null; } catch { hot = null; }
  if (hot && validState(hot) && hot.phase === 'play') { startFrom(hot); return; }
  // 첫 화면: 보드 미리보기 + 새 게임 설정 (저장된 게임이 있으면 이어하기)
  S = previewState();
  renderAll();
  setMsg('새 게임을 설정하고 시작하세요');
  setAction('setup', '게임 시작');
  openSetup(loadPlayable());
}

// 개발용: 화면 없이 컴퓨터끼리 여러 판을 돌려 규칙 위반을 점검
window.__ER = {
  async sim(n = 100, seed = 1, opt = {}) {
    const prev = { S, io, h: G.headless }; G.headless = true; io = headlessIO; G.audit = [];
    const out = { games: 0, rounds: [], bankrupts: 0, earlyEnd: 0, errors: [], winnerCash: [], turnsPerPlayer: [] };
    for (let g = 0; g < n; g++) {
      const np = opt.players || 3;
      S = newState({ players: Array.from({ length: np }, (_, i) => ({ name: `AI${i + 1}`, ai: true })),
        startCash: opt.startCash || 1000, laps: opt.laps || 4, extra: opt.extra !== false }, seed + g);
      try { await gameLoop(); } catch (e) { out.errors.push(String((e && e.stack) || e)); }
      out.games++; out.rounds.push(S.round);
      out.bankrupts += S.players.filter(p => p.out).length;
      if (active().length <= 1) out.earlyEnd++;
      out.winnerCash.push(ranking()[0].total);
      out.turnsPerPlayer.push(S.turns / np);
    }
    out.audit = G.audit.slice(0, 20); out.auditCount = G.audit.length;
    S = prev.S; io = prev.io; G.headless = prev.h;
    return out;
  },
  state: () => S,
  force(deck, id) { G.force = G.force || {}; G.force[deck] = id; },
  roll(a, b) { (G.rollQueue = G.rollQueue || []).push([a, b]); },
  patch(fn) { fn(S); if (io.refresh) io.refresh(); },
};

boot({});

// 오프라인에서도 열리도록 서비스워커 등록 (https 또는 localhost에서만)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
})();
</script>
